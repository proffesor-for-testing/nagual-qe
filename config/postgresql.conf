# PostgreSQL Configuration for Nagual
# Optimized for vector similarity search with pgvector
#
# This configuration is mounted into the Docker container.
# Adjust values based on available system resources.

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

listen_addresses = '*'
port = 5432
max_connections = 100

# ============================================================================
# MEMORY SETTINGS
# ============================================================================

# Shared memory for caching data
# Recommendation: 25% of system RAM
shared_buffers = 256MB

# Memory for maintenance operations (VACUUM, CREATE INDEX)
# Higher values speed up index creation
maintenance_work_mem = 128MB

# Memory per operation (sorting, hashing)
# Be careful with high values as it's per-connection
work_mem = 16MB

# Cache size hint for planner
# Recommendation: 50-75% of system RAM
effective_cache_size = 768MB

# ============================================================================
# WRITE-AHEAD LOG (WAL) SETTINGS
# ============================================================================

wal_level = replica
wal_buffers = 16MB
min_wal_size = 80MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# ============================================================================
# QUERY PLANNER SETTINGS
# ============================================================================

# Cost settings (lower for SSDs)
random_page_cost = 1.1
effective_io_concurrency = 200

# Enable parallel queries
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ============================================================================
# VECTOR SEARCH SETTINGS (pgvector)
# ============================================================================

# Load pgvector extension
shared_preload_libraries = 'vector'

# Default HNSW search parameter
# Higher = more accurate but slower
# Set per-session with: SET hnsw.ef_search = 100;
# hnsw.ef_search = 40  # (set via SQL if needed)

# ============================================================================
# LOGGING SETTINGS
# ============================================================================

# Log DDL statements (CREATE, ALTER, DROP)
log_statement = 'ddl'

# Log slow queries (> 1 second)
log_min_duration_statement = 1000

# Log lock waits
log_lock_waits = on

# Log timezone
log_timezone = 'UTC'

# ============================================================================
# LOCALE SETTINGS
# ============================================================================

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ============================================================================
# SSL/TLS SETTINGS
# ============================================================================

# SSL is disabled by default for local development
# Enable for production deployments
ssl = off

# For production, uncomment and configure:
# ssl = on
# ssl_cert_file = '/etc/postgresql/server.crt'
# ssl_key_file = '/etc/postgresql/server.key'
# ssl_ca_file = '/etc/postgresql/ca.crt'
# ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
# ssl_prefer_server_ciphers = on
# ssl_min_protocol_version = 'TLSv1.2'

# ============================================================================
# AUTOVACUUM SETTINGS
# ============================================================================

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ============================================================================
# STATISTICS SETTINGS
# ============================================================================

# Higher values improve planner decisions for complex queries
default_statistics_target = 100

# Track execution counts of statements
track_counts = on
track_activities = on

# ============================================================================
# CLIENT CONNECTION DEFAULTS
# ============================================================================

# Statement timeout (0 = no limit)
statement_timeout = 0

# Lock timeout (0 = no limit)
lock_timeout = 0

# Idle session timeout (0 = no limit)
idle_in_transaction_session_timeout = 30min
