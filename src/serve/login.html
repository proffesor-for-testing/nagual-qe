<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagual - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1a2e;--panel:#16213e;--accent:#e94560;--accent2:#0f3460;
  --text:#e0e0e0;--text-muted:#8888aa;--success:#4ecca3;--warn:#f5a623;
  --border:#2a2a4e;--error:#e94560;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-container{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.login-header{text-align:center;margin-bottom:32px}
.login-header h1{font-size:1.6rem;font-weight:600;letter-spacing:0.5px;margin-bottom:8px}
.login-header h1 span{color:var(--accent)}
.login-header p{color:var(--text-muted);font-size:0.85rem}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:0.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.form-group input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 14px;color:var(--text);font-size:0.95rem;transition:border-color 0.2s}
.form-group input:focus{border-color:var(--accent);outline:none}
.error-msg{background:rgba(233,69,96,0.15);border:1px solid var(--error);border-radius:6px;padding:10px 14px;margin-bottom:20px;font-size:0.85rem;color:var(--error);display:none}
.error-msg.visible{display:block}
.login-btn{width:100%;background:var(--accent);border:none;border-radius:6px;padding:12px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity 0.2s;letter-spacing:0.5px}
.login-btn:hover{opacity:0.9}
.login-btn:disabled{opacity:0.5;cursor:not-allowed}
.footer{text-align:center;margin-top:24px;color:var(--text-muted);font-size:0.75rem}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <h1><span>N</span>agual</h1>
    <p>Self-Learning Knowledge System</p>
  </div>
  <div id="error" class="error-msg"></div>
  <form id="loginForm" method="POST" action="/login">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
  </form>
  <div class="footer">Nagual Dashboard</div>
</div>
<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('error');
const btn = document.getElementById('loginBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errorEl.classList.remove('visible');

  const payload = {
    username: document.getElementById('username').value,
    password: document.getElementById('password').value
  };
  try {
    const resp = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (resp.ok || resp.status === 303) {
      window.location.href = '/';
      return;
    }
    const text = await resp.text();
    errorEl.textContent = text || 'Invalid username or password';
    errorEl.classList.add('visible');
  } catch (err) {
    errorEl.textContent = 'Connection error. Please try again.';
    errorEl.classList.add('visible');
  }
  btn.disabled = false;
  btn.textContent = 'Sign In';
});

// Show error from URL param (e.g., ?error=Invalid+credentials)
const params = new URLSearchParams(window.location.search);
if (params.get('error')) {
  errorEl.textContent = params.get('error');
  errorEl.classList.add('visible');
}
</script>
</body>
</html>
