version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundle routine patch/minor updates into one PR per week.
      patches:
        applies-to: version-updates
        update-types: [patch, minor]
      # Security fixes go through individually so we can review them
      # on their own and merge fast.
      security:
        applies-to: security-updates
        update-types: [patch, minor, major]
    ignore:
      # Pinned for now — migrating call-sites to rand 0.9 APIs is a
      # tracked cleanup (13 breaking usages across the tree).
      - dependency-name: rand
        versions: [">=0.9"]
      # rand_chacha must stay on the same line as rand (0.3 <-> rand 0.8). #16/#19 bumped it
      # to 0.9/0.10 and silently broke tests/holdout_test.rs (CI only ran --lib at the time).
      - dependency-name: rand_chacha
        versions: [">=0.9"]
      # Majors that changed public APIs and needed hand-migration (#26 sha3 → shake crate,
      # #29 sqlx 0.9 AssertSqlSafe). Review these by hand rather than auto-merging.
      - dependency-name: sqlx
        update-types: [version-update:semver-major]
      - dependency-name: sha3
        update-types: [version-update:semver-major]
      - dependency-name: axum
        update-types: [version-update:semver-major]
      # Pinned at rc.11 — rc.12 dropped `ort::tensor` and breaks the
      # embedder. Unpin after migrating.
      - dependency-name: ort
        versions: [">=2.0.0-rc.12"]
      # ratatui 0.26 → 0.30 was a major rev; we upgraded. Hold the
      # line on further majors until we have bandwidth to re-test.
      - dependency-name: ratatui
        update-types: [version-update:semver-major]
      - dependency-name: crossterm
        update-types: [version-update:semver-major]
      # reqwest 0.11 → 0.13 is a double-major bump with breaking API
      # changes across cloud/, serve/, sync/gcloud.rs. Unpin once the
      # call-sites are migrated.
      - dependency-name: reqwest
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
