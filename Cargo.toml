[package]
name = "nagual"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Self-learning knowledge system for quality engineering with dual-write persistence"
authors = ["Nagual-QE contributors"]
license = "MIT"
repository = "https://github.com/proffesor-for-testing/nagual-qe"
readme = "README.md"
keywords = ["agents", "memory", "learning", "testing", "qe"]
categories = ["database", "development-tools::testing"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.9"

# Database
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "derive"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "blob", "functions"] }

# Embeddings & ML
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"], optional = true }
ndarray = "0.15"
tokenizers = { version = "0.15", optional = true }
instant-distance = "0.6"
sha3 = "0.10"

# Meta-cognitive self-critique (Hofstadter-inspired strange loops)
strange-loop = { version = "0.3", optional = true }

# Cross-domain transfer learning via Meta Thompson Sampling
ruvector-domain-expansion = { version = "2.0", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP & Cloud
reqwest = { version = "0.11", features = ["json", "gzip"] }
cloud-storage = "0.11"

# Compression
flate2 = "1"

# Crypto
ring = "0.17"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
blake3 = "1.5"

# Utilities
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hashbrown = { version = "0.14", features = ["serde"] }
rand = "0.9"
parking_lot = "0.12"
regex = "1"
hex = "0.4"
base64 = "0.22"
lru = "0.16"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# System info
hostname = "0.3"
libc = "0.2"

# Desktop notifications
notify-rust = "4"

# TUI (optional)
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }

# Serve / Dashboard (optional)
axum = { version = "0.7", optional = true, features = ["ws", "macros"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
futures-util = { version = "0.3", optional = true }
serde_yaml = "0.9.34"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3"
rand_chacha = "0.3"

[features]
default = ["kos", "onnx-embed"]
tui = ["ratatui", "crossterm"]
serve = ["axum", "tower", "tower-http", "futures-util"]
full = ["tui", "serve"]

# Embedding backend (ONNX is optional, hash embedder always available)
onnx-embed = ["ort", "tokenizers"]

# Meta-cognitive evaluation via strange-loop recursive self-critique
strange-loop-meta = ["strange-loop"]

# Cross-domain transfer learning via Meta Thompson Sampling (ruvector)
domain-expansion = ["ruvector-domain-expansion"]

# mcp-brain integrations
mincut = []
brain-sync = []

# KOS (Knowledge Operating System) features
lineage = []
witness = ["lineage"]
delta = ["lineage"]
coherence-scoring = []
domain-transfer = ["lineage"]
epochs = ["lineage"]
mcp-server = ["coherence-scoring"]
tiering = []
agent-views = []
ewc = []
routing-ladder = ["tiering"]
hyperbolic-index = []
kos = ["lineage", "witness", "delta", "coherence-scoring", "domain-transfer", "epochs", "mcp-server", "tiering", "agent-views", "ewc", "routing-ladder", "hyperbolic-index", "mincut", "brain-sync", "strange-loop-meta", "domain-expansion"]

[[bench]]
name = "retrieval_benchmark"
harness = false

[[bench]]
name = "embedding_benchmark"
harness = false

[[bench]]
name = "hnsw_perf"
harness = false

[[bench]]
name = "hyperbolic_vs_euclidean"
harness = false

[[bench]]
name = "comprehensive_benchmark"
harness = false

[[bench]]
name = "factory_benchmarks"
harness = false

[[bin]]
name = "nagual"
path = "src/main.rs"
